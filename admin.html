    <main class="page-shell">
      <div class="container auth-layout">
        <section class="auth-card admin-card">
          <div class="auth-panel active admin-panel">
            <h2>Admin Dashboard</h2>
            <p class="small-note">Add new shop products directly. Select the category to publish them under Kids wear or Accessories.</p>

            <form id="adminProductForm" class="auth-form admin-product-form">
              <input type="text" id="productName" placeholder="Product Name" required />
              <textarea id="productDescription" rows="3" placeholder="Product Description" required></textarea>
              <input type="text" id="productPrice" placeholder="Price (e.g. 45.00)" required />
              <input type="file" id="productImage" accept="image/*" required />
              <select id="productCategory" required>
                <option value="">Select Category</option>
                <option value="Kids wear">Kids wear</option>
                <option value="Accessories">Accessories</option>
              </select>
              <select id="productSection" required>
                <option value="">Select Section</option>
              </select>
              <button type="submit" class="btn primary">Add Product</button>
            </form>
